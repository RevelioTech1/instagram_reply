server {
    listen 80;
    listen [::]:80;
    server_name insta.iordani.info;
    auth_basic "Iordani Instagram";
    auth_basic_user_file /etc/nginx/insta.htpasswd;
    client_max_body_size 10m;

    location = /api/instagram/webhook {
        auth_basic off;
        proxy_pass http://127.0.0.1:4317;
        include /etc/nginx/snippets/insta-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:4317;
        include /etc/nginx/snippets/insta-proxy.conf;
    }
}
